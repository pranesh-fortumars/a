<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BFA5" />
      <stop offset="100%" stop-color="#00695C" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00897B" />
      <stop offset="100%" stop-color="#004D40" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C853" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>
  </defs>

  <!-- Transparent Background -->
  <rect width="800" height="640" fill="transparent" />

  <!-- Animated pulsing background dots -->
  <circle cx="400" cy="80" r="45" fill="#00BFA5" opacity="0.15" filter="url(#glow)">
    <animate attributeName="r" values="45;65;45" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.15;0.35;0.15" dur="3s" repeatCount="indefinite" />
  </circle>

  <g stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" fill="none">
    <!-- Lines with animated dashed stroke -->
    <!-- AI to ML, DL, CV -->
    <path d="M400,100 L200,180" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="1.5s" repeatCount="indefinite" />
    </path>
    <path d="M400,100 L400,180" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="1.5s" repeatCount="indefinite" />
    </path>
    <path d="M400,100 L600,180" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="1.5s" repeatCount="indefinite" />
    </path>
    
    <!-- ML to FS -->
    <path d="M200,220 L200,300" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="1.5s" repeatCount="indefinite" />
    </path>
    <!-- FS to Cloud and Backends -->
    <path d="M200,340 L400,340" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="1.5s" repeatCount="indefinite" />
    </path>
    <path d="M400,340 L600,340" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="1.5s" repeatCount="indefinite" />
    </path>
    <path d="M200,340 L200,420" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="1.5s" repeatCount="indefinite" />
    </path>
    <!-- Cloud to DevOps -->
    <path d="M400,340 L400,420" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="1.5s" repeatCount="indefinite" />
    </path>
    <!-- BE to Blockchain -->
    <path d="M200,460 L200,540" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="1.5s" repeatCount="indefinite" />
    </path>
    <!-- Blockchain to CY, ES -->
    <path d="M200,560 L400,560" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="1.5s" repeatCount="indefinite" />
    </path>
    <path d="M400,560 L600,560" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="1.5s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Nodes -->
  <g font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <!-- Level 1 -->
    <!-- AI -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="4s" repeatCount="indefinite" />
      <circle cx="400" cy="80" r="45" fill="url(#aiGrad)" stroke="#00BFA5" stroke-width="3" filter="url(#glow)" />
      <text x="400" y="86">AI</text>
    </g>

    <!-- Level 2 -->
    <!-- ML -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,6; 0,0" dur="3.2s" repeatCount="indefinite" />
      <rect x="120" y="180" width="160" height="44" rx="22" fill="url(#aiGrad)" stroke="#00BFA5" stroke-width="2" />
      <text x="200" y="207">Machine Learning</text>
    </g>

    <!-- DL -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="3.7s" repeatCount="indefinite" />
      <rect x="320" y="180" width="160" height="44" rx="22" fill="url(#aiGrad)" stroke="#00BFA5" stroke-width="2" />
      <text x="400" y="207">Deep Learning</text>
    </g>

    <!-- CV -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,4; 0,0" dur="2.8s" repeatCount="indefinite" />
      <rect x="520" y="180" width="160" height="44" rx="22" fill="url(#aiGrad)" stroke="#00BFA5" stroke-width="2" />
      <text x="600" y="207">Computer Vision</text>
    </g>

    <!-- Level 3 -->
    <!-- FS -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" dur="4.2s" repeatCount="indefinite" />
      <rect x="120" y="320" width="160" height="44" rx="6" fill="url(#cloudGrad)" stroke="#00897B" stroke-width="2" />
      <text x="200" y="347">Full Stack</text>
    </g>

    <!-- CL -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,5; 0,0" dur="3.9s" repeatCount="indefinite" />
      <rect x="320" y="320" width="160" height="44" rx="6" fill="url(#cloudGrad)" stroke="#00897B" stroke-width="2" />
      <text x="400" y="347">Cloud Infra</text>
    </g>

    <!-- K8s -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="4.5s" repeatCount="indefinite" />
      <rect x="520" y="320" width="160" height="44" rx="6" fill="url(#cloudGrad)" stroke="#00897B" stroke-width="2" />
      <text x="600" y="347">Kubernetes</text>
    </g>

    <!-- Level 4 -->
    <!-- BE -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,6; 0,0" dur="3.4s" repeatCount="indefinite" />
      <rect x="120" y="440" width="160" height="44" rx="6" fill="url(#cloudGrad)" stroke="#00897B" stroke-width="2" />
      <text x="200" y="467">Backend Eng.</text>
    </g>

    <!-- DO -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-7; 0,0" dur="3.1s" repeatCount="indefinite" />
      <rect x="320" y="440" width="160" height="44" rx="6" fill="url(#cloudGrad)" stroke="#00897B" stroke-width="2" />
      <text x="400" y="467">DevOps &amp; CI/CD</text>
    </g>

    <!-- Level 5 -->
    <!-- BC -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="4.8s" repeatCount="indefinite" />
      <rect x="120" y="540" width="160" height="44" rx="22" fill="url(#coreGrad)" stroke="#00E676" stroke-width="3" filter="url(#glow)" />
      <text x="200" y="567" fill="#000000">Blockchain</text>
    </g>

    <!-- CY -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,5; 0,0" dur="3.7s" repeatCount="indefinite" />
      <rect x="320" y="540" width="160" height="44" rx="22" fill="url(#coreGrad)" stroke="#00E676" stroke-width="2" />
      <text x="400" y="567" fill="#000000">Cybersecurity</text>
    </g>

    <!-- ES -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="4.1s" repeatCount="indefinite" />
      <rect x="520" y="540" width="160" height="44" rx="22" fill="url(#coreGrad)" stroke="#00E676" stroke-width="2" />
      <text x="600" y="567" fill="#000000">Enterprise SW</text>
    </g>
  </g>
</svg>
